<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#dc2626" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Neon Ring -->
  <rect x="12" y="12" width="488" height="488" rx="105" fill="none" stroke="#dc2626" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Tactical Main Panel Shield Container -->
  <g filter="url(#badgeGlow)">
    <!-- Shield Body -->
    <path d="M 256,76 
             C 320,118 396,126 404,130
             C 404,260 338,368 256,436
             C 174,368 108,260 108,130
             C 116,126 192,118 256,76 Z" 
          fill="url(#shieldBg)" 
          stroke="url(#shieldStroke)" 
          stroke-width="12" 
          stroke-linejoin="round"/>
  </g>

  <!-- Shield Inner Bevel Accent -->
  <path d="M 256,98 
           C 310,134 374,142 382,146
           C 382,250 326,346 256,406
           C 186,346 130,250 130,146
           C 138,142 202,134 256,98 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-opacity="0.25"/>

  <!-- Shield Alert Inner Symbol: Exclamation Mark (Lucide ShieldAlert Style) -->
  <g filter="url(#glow)">
    <!-- Upper Exclamation Bar -->
    <path d="M 256,170 
             L 256,275" 
          stroke="#ffffff" 
          stroke-width="26" 
          stroke-linecap="round"/>
    
    <!-- Exclamation Dot -->
    <circle cx="256" cy="336" r="14" fill="#ffffff" />
  </g>
</svg>
